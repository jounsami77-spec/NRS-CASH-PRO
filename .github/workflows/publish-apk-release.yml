name: Publish NRS Cash Pro APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        default: v1.1.3
        type: string
  push:
    tags:
      - 'v1.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 10000
          unzip -t "$APK"
          unzip -Z1 "$APK" > /tmp/nrs-apk-contents.txt
          grep -Fxq 'AndroidManifest.xml' /tmp/nrs-apk-contents.txt
          grep -Eq '(^|/)classes[0-9]*\.dex$' /tmp/nrs-apk-contents.txt
          cp "$APK" NRS-CASH-PRO-1.1.3.apk
          sha256sum NRS-CASH-PRO-1.1.3.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: N.R.S. CASH PRO 1.1.3
          body: |
            N.R.S. CASH PRO Android release 1.1.3 (versionCode 5).

            Download NRS-CASH-PRO-1.1.3.apk below.
            Invoice printing is still pending further testing.
          files: NRS-CASH-PRO-1.1.3.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
