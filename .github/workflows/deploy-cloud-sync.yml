name: NRS Cloud Sync Worker

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "تأكيد تطبيق مخطط D1 ونشر Worker على Cloudflare"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "cloud-sync-worker/**"
      - ".github/workflows/deploy-cloud-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        working-directory: cloud-sync-worker
        run: node --check src/index.js

      - name: Run sync validation tests
        working-directory: cloud-sync-worker
        run: node --test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment configuration
        working-directory: cloud-sync-worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ADMIN_SECRET" || { echo "Missing ADMIN_BOOTSTRAP_SECRET"; exit 1; }
          if grep -q "REPLACE_WITH_REAL_D1_DATABASE_ID" wrangler.jsonc; then
            echo "D1 database_id has not been configured yet."
            exit 1
          fi

      - name: Install Wrangler
        working-directory: cloud-sync-worker
        run: npm install

      - name: Apply D1 schema
        working-directory: cloud-sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute nrs-cash-pro-sync-db --remote --file=./schema.sql

      - name: Set Worker admin secret
        working-directory: cloud-sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_BOOTSTRAP_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
        run: |
          printf '%s' "$ADMIN_BOOTSTRAP_SECRET" | npx wrangler secret put ADMIN_BOOTSTRAP_SECRET

      - name: Deploy Worker
        working-directory: cloud-sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
