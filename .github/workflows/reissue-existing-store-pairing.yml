name: Reissue encrypted pairing for existing NRS store
on:
  workflow_dispatch:
    inputs:
      store_id:
        description: Existing store UUID (does not create a store)
        required: true
        type: string
      public_key_b64:
        description: Base64 RSA public key
        required: true
        type: string

permissions:
  contents: read

jobs:
  reissue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Issue code for existing store and encrypt it
        shell: bash
        env:
          STORE_ID: ${{ inputs.store_id }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
          WORKER_ADMIN_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "${WORKER_ADMIN_SECRET:-}"
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > public.pem
          openssl pkey -pubin -in public.pem -noout
          jq -n --arg id "$STORE_ID" '{store_id:$id}' > request.json
          code="$(curl --silent --show-error --output response.json \
            --write-out '%{http_code}' --request POST \
            "https://nrs-cash-pro-sync.jounsami77.workers.dev/v1/admin/stores/${STORE_ID}/pairing-code" \
            --header "Authorization: Bearer ${WORKER_ADMIN_SECRET}" \
            --header 'Content-Type: application/json' \
            --data-binary @request.json)"
          if [ "$code" != "201" ]; then
            echo "::error::Pairing issuance failed; response hidden"
            exit 1
          fi
          jq -e --arg id "$STORE_ID" \
            '.ok == true and .store_id == $id and (.pairing_code|type == "string")' \
            response.json >/dev/null
          jq -r '.pairing_code' response.json > pairing-code.txt
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -in pairing-code.txt -out pairing.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          jq '{store_id,store_name,expires_in_seconds}' response.json > metadata.json
          mkdir -p encrypted-pairing
          mv pairing.enc metadata.json encrypted-pairing/
          rm -f response.json pairing-code.txt request.json public.pem
          echo "Fresh pairing code encrypted for existing store."
      - name: Upload encrypted pairing
        uses: actions/upload-artifact@v4
        with:
          name: nrs-existing-store-pairing
          path: encrypted-pairing/
          retention-days: 1
          if-no-files-found: error
