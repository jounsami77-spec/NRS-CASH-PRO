name: NRS Cash Pro Native Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Native Debug APK
        working-directory: native-android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "APK_SIZE=$(stat -c%s "$APK")"

          if unzip -l "$APK" | grep -E 'lib/.*/(libnode|libnrsnode)\.so'; then
            echo "ERROR: Node library found"
            exit 1
          fi

          if unzip -l "$APK" | grep -E 'assets/.*/server\.js'; then
            echo "ERROR: Embedded Node server found"
            exit 1
          fi

          echo "Native APK verification passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nrs-cash-pro-native-fresh-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
