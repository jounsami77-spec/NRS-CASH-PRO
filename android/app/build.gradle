plugins {
    id 'com.android.application'
}

android {
    ndkVersion "27.2.12479018"

    namespace 'dz.nrs.cashpro'
    compileSdk 35

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        applicationId 'dz.nrs.cashpro'
        minSdk 23
        targetSdk 28
        versionCode 5
        versionName "1.1.3"

        ndk {
            abiFilters "arm64-v8a"
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

}
