plugins {
    id 'com.android.application'
}

android {
    ndkVersion "27.2.12479018"

    namespace 'dz.nrs.cashpro'
    compileSdk 35

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        applicationId 'dz.nrs.cashpro'
        minSdk 23
        targetSdk 28
        versionCode 11
        versionName "1.1.9"

        ndk {
            abiFilters "arm64-v8a"
        }
    }
    // NRS_SIDE_BY_SIDE_TEST_BUILD_V1
    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }


    // NRS_EXCLUDE_SOURCE_BACKUPS_FROM_APK
    // استبعاد النسخ الاحتياطية من APK مع إبقائها في المشروع.
    sourceSets {
        main {
            assets {
                exclude '**/*.before-*'
            }
        }
    }

}
