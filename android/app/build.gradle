plugins {
    id 'com.android.application'
}

android {
    ndkVersion "27.2.12479018"

    namespace 'dz.nrs.cashpro'
    compileSdk 35

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        applicationId 'dz.nrs.cashpro'
        minSdk 23
        targetSdk 28
        versionCode 12
        versionName "1.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }
    // RELEASE_SIGNING_CASH_PRO_SMGR_V1
    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    lint {
        disable += "ExpiredTargetSdkVersion"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }


    // NRS_EXCLUDE_SOURCE_BACKUPS_FROM_APK
    // استبعاد النسخ الاحتياطية من APK مع إبقائها في المشروع.
    sourceSets {
        main {
            assets {
                exclude '**/*.before-*'
            }
        }
    }

}
