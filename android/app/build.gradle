plugins {
    id 'com.android.application'
}

android {
    ndkVersion "27.2.12479018"

    namespace 'dz.nrs.cashpro'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += 'edition'
    productFlavors {
        owner {
            dimension 'edition'
            buildConfigField 'String', 'NRS_APP_EDITION', '"owner"'
            manifestPlaceholders = [appLabel: 'cash.pro.S.M.G.R']
        }
        customer {
            dimension 'edition'
            applicationIdSuffix '.customer'
            buildConfigField 'String', 'NRS_APP_EDITION', '"customer"'
            manifestPlaceholders = [appLabel: 'cash.pro - الزبون']
        }
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        applicationId 'dz.nrs.cashpro'
        minSdk 23
        targetSdk 28
        versionCode 14
        versionName "1.2.2"

        ndk {
            abiFilters "arm64-v8a"
        }
    }
    // RELEASE_SIGNING_CASH_PRO_SMGR_V1
    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    lint {
        disable += "ExpiredTargetSdkVersion"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }


    // NRS_EXCLUDE_SOURCE_BACKUPS_FROM_APK
    // استبعاد النسخ الاحتياطية من APK مع إبقائها في المشروع.
    sourceSets {
        main {
            assets {
                exclude '**/*.before-*'
            }
        }
    }

}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
